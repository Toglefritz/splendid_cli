# Flutter Launcher Icons configuration
# This file is used to generate app icons for the GUI dashboard

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "../../images/icon.png"
  
  # Desktop platforms
  windows:
    generate: true
    image_path: "../../images/icon.png"
  macos:
    generate: true
    image_path: "../../images/icon.png"
  linux:
    generate: true
    image_path: "../../images/icon.png"