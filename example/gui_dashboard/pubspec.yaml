name: splendid_cli_gui
description: GUI Dashboard for Splendid CLI - A visual interface for Flutter project management with MVC architecture.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.0
  path: ^1.8.3
  process: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/