name: splendid_cli_gui
description: GUI Dashboard for Splendid CLI - A visual interface for Flutter project management with MVC architecture.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=3.16.0"

dependencies:
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  process: ^5.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/